<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 — Kate's Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft-xl': '0 20px 40px -15px rgba(0, 0, 0, 0.05), 0 0 15px 0 rgba(0, 0, 0, 0.03)',
                        'glow-indigo': '0 10px 30px -5px rgba(99, 102, 241, 0.25)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 15% 15%, rgba(224, 231, 255, 0.7) 0%, rgba(241, 245, 249, 0.8) 45%, rgba(254, 226, 226, 0.5) 100%),
                        linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Package badge color themes */
        .pkg-1 { background-color: #dcfce7; color: #14532d; border: 1px solid #86efac; }
        .pkg-2 { background-color: #ffedd5; color: #7c2d12; border: 1px solid #fdba74; }
        .pkg-3 { background-color: #f3e8ff; color: #581c87; border: 1px solid #d8b4fe; }
        .pkg-4 { background-color: #ccfbf1; color: #134e4a; border: 1px solid #5eead4; }
        .pkg-5 { background-color: #ffe4e6; color: #881337; border: 1px solid #fecdd3; }
        .pkg-6 { background-color: #e0f2fe; color: #0c4a6e; border: 1px solid #7dd3fc; }
        .pkg-7 { background-color: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .pkg-8 { background-color: #fef3c7; color: #78350f; border: 1px solid #fde68a; }
        .pkg-9 { background-color: #e0e7ff; color: #3730a3; border: 1px solid #a5b4fc; } /* Autumn Package */

        /* Lesson highlighting with border indicator */
        .has-lesson {
            box-shadow: inset 0 0 0 2px #2563eb, 0 2px 6px rgba(37, 99, 235, 0.3);
            font-weight: 700 !important;
            position: relative;
        }

        .has-lesson::after {
            content: '';
            position: absolute;
            top: 3px;
            right: 3px;
            width: 6px;
            height: 6px;
            background-color: #2563eb;
            border-radius: 50%;
        }

        .weekend-day {
            background-color: #fff1f2;
            color: #e11d48;
        }
    </style>
</head>
<body class="text-slate-800 antialiased py-8 px-4 sm:px-6 lg:px-10">
    <div class="max-w-7xl mx-auto space-y-8">
        
        <!-- Header Section (Centered content with ambient glow background) -->
        <header class="relative bg-white/70 backdrop-blur-2xl rounded-3xl p-8 sm:p-10 border border-white/90 shadow-soft-xl text-center overflow-hidden">
            <!-- Decorative background ambient lights -->
            <div class="absolute -top-12 -left-12 w-48 h-48 bg-indigo-300/30 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -right-12 w-48 h-48 bg-rose-300/30 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-24 bg-sky-200/20 rounded-full blur-2xl pointer-events-none"></div>

            <div class="relative z-10 flex flex-col items-center justify-center space-y-2">
                <span class="inline-block px-5 py-1.5 rounded-full bg-gradient-to-r from-indigo-500 to-blue-600 text-white text-xs sm:text-sm font-extrabold tracking-widest uppercase shadow-glow-indigo">
                    2026
                </span>
                <h1 class="text-3xl sm:text-5xl font-black text-slate-900 tracking-tight bg-gradient-to-r from-slate-900 via-indigo-950 to-blue-900 bg-clip-text text-transparent pt-1">
                    Kate's Calendar
                </h1>
            </div>
        </header>

        <!-- Dynamic Hover Info Bar -->
        <div id="info-bar" class="hidden transition-all duration-300 bg-gradient-to-r from-slate-900 to-indigo-950 text-white px-6 py-3.5 rounded-2xl shadow-xl flex flex-col sm:flex-row items-center justify-between gap-3 text-sm sm:text-base font-medium">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-indigo-400 animate-ping"></div>
                <span id="info-date" class="font-bold text-indigo-200"></span>
            </div>
            <span id="info-status" class="bg-indigo-900/80 border border-indigo-700/50 px-4 py-1 rounded-xl text-xs sm:text-sm font-semibold"></span>
        </div>

        <main>
            <div id="calendar-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </main>

        <footer class="text-center py-6 text-xs font-medium text-slate-400 border-t border-slate-200/60">
            © 2026 Kate's Calendar — Персональный график занятий
        </footer>
    </div>

    <script>
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const dayNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
        const year = 2026;

        // Package Data Definitions for Kate (Packages 1 to 9)
        const packages = [
            { id: 1, name: "Пакет 1", period: "13 янв – 09 фев", colorClass: "pkg-1", days: [
                "2026-01-13","2026-01-14","2026-01-15","2026-01-16",
                "2026-01-19","2026-01-20","2026-01-21","2026-01-22","2026-01-23",
                "2026-01-26","2026-01-27","2026-01-28","2026-01-29","2026-01-30",
                "2026-02-02","2026-02-03","2026-02-04","2026-02-05","2026-02-06","2026-02-09"
            ]},
            { id: 2, name: "Пакет 2", period: "10 фев – 09 мар", colorClass: "pkg-2", days: [
                "2026-02-10","2026-02-11","2026-02-12","2026-02-13",
                "2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20",
                "2026-02-23","2026-02-24","2026-02-25","2026-02-26","2026-02-27",
                "2026-03-02","2026-03-03","2026-03-04","2026-03-05","2026-03-06","2026-03-09"
            ]},
            { id: 3, name: "Пакет 3", period: "10 мар – 06 апр", colorClass: "pkg-3", days: [
                "2026-03-10","2026-03-11","2026-03-12","2026-03-13",
                "2026-03-16","2026-03-17","2026-03-18","2026-03-19","2026-03-20",
                "2026-03-23","2026-03-24","2026-03-25","2026-03-26","2026-03-27",
                "2026-03-30","2026-03-31","2026-04-01","2026-04-02","2026-04-03","2026-04-06"
            ]},
            { id: 4, name: "Пакет 4", period: "07 апр – 05 май", colorClass: "pkg-4", days: [
                "2026-04-07","2026-04-08","2026-04-09","2026-04-10",
                "2026-04-13","2026-04-14","2026-04-15","2026-04-16","2026-04-17",
                "2026-04-20","2026-04-21","2026-04-22","2026-04-23","2026-04-24",
                "2026-04-27","2026-04-28","2026-04-29","2026-04-30","2026-05-04","2026-05-05"
            ]},
            { id: 5, name: "Пакет 5", period: "08 май – 04 июн", colorClass: "pkg-5", days: [
                "2026-05-08",
                "2026-05-11","2026-05-12","2026-05-13","2026-05-14","2026-05-15",
                "2026-05-18","2026-05-19","2026-05-20","2026-05-21","2026-05-22",
                "2026-05-25","2026-05-26","2026-05-27","2026-05-28","2026-05-29",
                "2026-06-01","2026-06-02","2026-06-03","2026-06-04"
            ]},
            { id: 6, name: "Пакет 6", period: "05 июн – 03 июл", colorClass: "pkg-6", days: [
                "2026-06-05",
                "2026-06-08","2026-06-09","2026-06-10","2026-06-11","2026-06-12",
                "2026-06-15","2026-06-16","2026-06-17","2026-06-18","2026-06-19",
                "2026-06-22","2026-06-23","2026-06-24","2026-06-25","2026-06-26",
                "2026-06-29","2026-06-30","2026-07-01","2026-07-02","2026-07-03"
            ]},
            { id: 7, name: "Пакет 7", period: "07 июл – 03 авг", colorClass: "pkg-7", days: [
                "2026-07-07","2026-07-08","2026-07-09","2026-07-10",
                "2026-07-13","2026-07-14","2026-07-15","2026-07-16","2026-07-17",
                "2026-07-20","2026-07-21","2026-07-22","2026-07-23","2026-07-24",
                "2026-07-27","2026-07-28","2026-07-29","2026-07-30","2026-07-31","2026-08-03"
            ]},
            { id: 8, name: "Пакет 8", period: "04 авг – 31 авг", colorClass: "pkg-8", days: [
                "2026-08-04","2026-08-05","2026-08-06","2026-08-07",
                "2026-08-10","2026-08-11","2026-08-12","2026-08-13","2026-08-14",
                "2026-08-17","2026-08-18","2026-08-19","2026-08-20","2026-08-21",
                "2026-08-24","2026-08-25","2026-08-26","2026-08-27","2026-08-28","2026-08-31"
            ]},
            { id: 9, name: "Пакет 9 (Осень ✨)", period: "01 сен – 28 сен (8 занятий)", colorClass: "pkg-9", days: [
                "2026-09-01","2026-09-02","2026-09-03","2026-09-04",
                "2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11",
                "2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18",
                "2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25","2026-09-28"
            ]}
        ];

        // Kate's Lessons (Tuesdays & Fridays)
        const lessons = [
            "2026-01-13","2026-01-16","2026-01-20","2026-01-23","2026-01-27","2026-01-30","2026-02-03","2026-02-06",
            "2026-02-10","2026-02-13","2026-02-17","2026-02-20","2026-02-24","2026-02-27","2026-03-03","2026-03-06",
            "2026-03-10","2026-03-13","2026-03-17","2026-03-20","2026-03-24","2026-03-27","2026-03-31","2026-04-03",
            "2026-04-07","2026-04-10","2026-04-14","2026-04-17","2026-04-21","2026-04-24","2026-04-28","2026-05-05",
            "2026-05-08","2026-05-12","2026-05-15","2026-05-19","2026-05-22","2026-05-26","2026-05-29","2026-06-02",
            "2026-06-05","2026-06-09","2026-06-16","2026-06-19","2026-06-23","2026-06-26","2026-06-30","2026-07-03",
            "2026-07-07","2026-07-10","2026-07-14","2026-07-17","2026-07-21","2026-07-24","2026-07-28","2026-07-31",
            "2026-08-04","2026-08-07","2026-08-11","2026-08-14","2026-08-18","2026-08-21","2026-08-25","2026-08-28",
            "2026-09-01","2026-09-04","2026-09-08","2026-09-11","2026-09-15","2026-09-18","2026-09-22","2026-09-25"
        ];

        function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getFirstDayOfMonth(y, m) { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; }
        function formatDate(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }

        function getPackageInfo(dateStr) {
            for (let pkg of packages) {
                if (pkg.days.includes(dateStr)) return pkg;
            }
            return null;
        }

        function isLesson(dateStr) { return lessons.includes(dateStr); }

        function createMonthCard(y, m) {
            const dim = getDaysInMonth(y, m);
            const off = getFirstDayOfMonth(y, m);
            const total = Math.ceil((off + dim) / 7) * 7;

            let html = `
            <div class="month-card bg-white/70 backdrop-blur-xl rounded-3xl p-5 border border-white/90 shadow-soft-xl transition-all duration-300 hover:shadow-2xl">
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                    <h3 class="text-lg font-extrabold text-slate-800 tracking-tight">${monthNames[m]}</h3>
                    <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100/80 text-slate-500 rounded-full">${y}</span>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center mb-2">
            `;

            dayNames.forEach((wd, idx) => {
                const isWk = idx >= 5;
                html += `<div class="text-xs font-bold ${isWk ? 'text-rose-500' : 'text-slate-400'} py-1">${wd}</div>`;
            });

            html += `</div><div class="grid grid-cols-7 gap-1 text-center">`;

            let day = 1;
            for (let i = 0; i < total; i++) {
                if (i >= off && day <= dim) {
                    const dateStr = formatDate(y, m, day);
                    const pkg = getPackageInfo(dateStr);
                    const hasLes = isLesson(dateStr);
                    const dateObj = new Date(y, m, day);
                    const isWk = dateObj.getDay() === 0 || dateObj.getDay() === 6;

                    let classes = "h-9 rounded-xl flex items-center justify-center text-xs font-medium transition-all duration-200 cursor-pointer hover:scale-105 ";
                    
                    if (pkg) {
                        classes += `${pkg.colorClass} `;
                    } else if (isWk) {
                        classes += "weekend-day ";
                    } else {
                        classes += "text-slate-700 hover:bg-slate-100/80 ";
                    }

                    if (hasLes) {
                        classes += "has-lesson ";
                    }

                    let statusText = [];
                    if (pkg) statusText.push(`${pkg.name}`);
                    if (hasLes) statusText.push("Занятие Кати (Вт / Пт)");
                    if (isWk && !pkg) statusText.push("Выходной");
                    if (statusText.length === 0) statusText.push("Свободный день");

                    const fullStatus = statusText.join(" • ");
                    const readableDate = `${day} ${monthNames[m]} ${y}`;

                    html += `
                        <div class="${classes}" 
                             onmouseenter="showInfo('${readableDate}', '${fullStatus}')"
                             onmouseleave="hideInfo()">
                            ${day}
                        </div>
                    `;
                    day++;
                } else {
                    html += `<div class="h-9"></div>`;
                }
            }

            html += `</div></div>`;
            return html;
        }

        function showInfo(date, status) {
            const bar = document.getElementById("info-bar");
            document.getElementById("info-date").textContent = date;
            document.getElementById("info-status").textContent = status;
            bar.classList.remove("hidden");
        }

        function hideInfo() {
            const bar = document.getElementById("info-bar");
            bar.classList.add("hidden");
        }

        function render() {
            const container = document.getElementById("calendar-container");
            container.innerHTML = "";
            for (let m = 0; m < 12; m++) {
                container.innerHTML += createMonthCard(year, m);
            }
        }

        render();
    </script>
</body>
</html>
