<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь занятий (Вт/Пт) 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .calendar-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1200px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
        }
        .month {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 550px;
            transition: transform 0.3s ease;
        }
        .month:hover {
            transform: translateY(-5px);
        }
        .month-title {
            text-align: center;
            font-size: 1.8em;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 700;
            letter-spacing: 1px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }
        .day-name {
            font-weight: 600;
            color: #3498db;
            padding: 12px 5px;
            font-size: 0.95em;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        .day {
            padding: 15px 5px;
            background-color: #f9f9f9;
            border-radius: 10px;
            font-size: 1.1em;
            position: relative;
            transition: all 0.2s ease;
        }
        .day:hover {
            background-color: #edf7ff;
        }
        .weekend {
            color: #e74c3c;
            background-color: #fff5f5;
        }
        .lesson-day {
            background-color: #e8f7ef;
            border: 2px solid #2ecc71;
            color: #27ae60;
            font-weight: 600;
            font-style: italic;
        }
        .lesson-day::after {
            content: '🎓';
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.8em;
            font-style: normal;
        }
        /* Хайлайт стал нежно-голубым */
        .highlight-day {
            background-color: #e8f7ff !important; /* Нежно-голубой фон */
            box-shadow: inset 0 0 0 2px #87ceeb;   /* Голубая рамка */
            font-weight: 600;
        }
        .empty {
            background-color: transparent;
            box-shadow: none;
        }
        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="header">
            <h1>📅 Календарь занятий 2026</h1>
            <p>Занятия по вторникам и пятницам (8 занятий)</p>
        </div>

        <!-- Январь 2026 -->
        <div class="month">
            <h2 class="month-title">Январь 2026</h2>
            <div class="calendar-grid">
                <div class="day-name">Пн</div>
                <div class="day-name">Вт</div>
                <div class="day-name">Ср</div>
                <div class="day-name">Чт</div>
                <div class="day-name">Пт</div>
                <div class="day-name weekend">Сб</div>
                <div class="day-name weekend">Вс</div>

                <div class="day empty"></div>
                <div class="day empty"></div>
                <div class="day empty"></div>
                <div class="day">1</div>
                <div class="day">2</div>
                <div class="day weekend">3</div>
                <div class="day weekend">4</div>

                <div class="day">5</div>
                <div class="day">6</div>
                <div class="day">7</div>
                <div class="day">8</div>
                <div class="day">9</div>
                <div class="day weekend">10</div>
                <div class="day weekend">11</div>

                <div class="day">12</div>
                <div class="day lesson-day highlight-day">13</div>
                <div class="day">14</div>
                <div class="day">15</div>
                <div class="day lesson-day highlight-day">16</div>
                <div class="day weekend">17</div>
                <div class="day weekend">18</div>

                <div class="day">19</div>
                <div class="day lesson-day highlight-day">20</div>
                <div class="day">21</div>
                <div class="day">22</div>
                <div class="day lesson-day highlight-day">23</div>
                <div class="day weekend">24</div>
                <div class="day weekend">25</div>

                <div class="day">26</div>
                <div class="day lesson-day highlight-day">27</div>
                <div class="day">28</div>
                <div class="day">29</div>
                <div class="day lesson-day highlight-day">30</div>
                <div class="day weekend">31</div>
            </div>
        </div>

        <!-- Февраль 2026 -->
        <div class="month">
            <h2 class="month-title">Февраль 2026</h2>
            <div class="calendar-grid">
                <div class="day-name">Пн</div>
                <div class="day-name">Вт</div>
                <div class="day-name">Ср</div>
                <div class="day-name">Чт</div>
                <div class="day-name">Пт</div>
                <div class="day-name weekend">Сб</div>
                <div class="day-name weekend">Вс</div>

                <div class="day">2</div>
                <div class="day lesson-day highlight-day">3</div>
                <div class="day">4</div>
                <div class="day">5</div>
                <div class="day lesson-day highlight-day">6</div>
                <div class="day weekend">7</div>
                <div class="day weekend">8</div>

                <div class="day">9</div>
                <div class="day lesson-day">10</div>
                <div class="day highlight-day">11</div>
                <div class="day">12</div>
                <div class="day lesson-day">13</div>
                <div class="day weekend">14</div>
                <div class="day weekend">15</div>

                <div class="day">16</div>
                <div class="day">17</div>
                <div class="day">18</div>
                <div class="day">19</div>
                <div class="day">20</div>
                <div class="day weekend">21</div>
                <div class="day weekend">22</div>

                <div class="day">23</div>
                <div class="day">24</div>
                <div class="day">25</div>
                <div class="day">26</div>
                <div class="day">27</div>
                <div class="day weekend">28</div>
                <div class="day empty"></div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.lesson-day').forEach(day => {
            day.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 150);
                const monthTitle = this.closest('.month').querySelector('.month-title').textContent.split(' ')[0];
                const lessonDates = {
                    "Январь": ["13", "16", "20", "23", "27", "30"],
                    "Февраль": ["3", "6", "10", "13"]
                };
                const lessonNumber = lessonDates[monthTitle]?.indexOf(this.textContent) + 1;
                const totalInMonth = lessonDates[monthTitle]?.length;
                alert(`Занятие ${lessonNumber} из ${totalInMonth} в ${monthTitle.toLowerCase()}: ${this.textContent} ${monthTitle.toLowerCase()}`);
            });
        });
        
        // Обновленный цвет при наведении для нежно-голубого хайлайта
        document.querySelectorAll('.highlight-day').forEach(day => {
            day.addEventListener('mouseenter', function() {
                if(!this.classList.contains('lesson-day')) {
                    this.style.backgroundColor = '#d4edff'; /* Более насыщенный голубой при наведении */
                }
            });
            day.addEventListener('mouseleave', function() {
                if(!this.classList.contains('lesson-day')) {
                    this.style.backgroundColor = '#e8f7ff'; /* Возвращаем нежно-голубой */
                }
            });
        });
    </script>
</body>
</html>
