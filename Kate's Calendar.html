<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kate 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .calendar-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1200px;
        }
        .month {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
        }
        .month-title {
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
            font-weight: 600;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }
        .day-name {
            font-weight: 600;
            color: #555;
            padding: 10px 5px;
            font-size: 0.9em;
            background-color: #f8f8f8;
            border-radius: 6px;
        }
        .day {
            padding: 12px 5px;
            background-color: #f9f9f9;
            border-radius: 8px;
            font-size: 1em;
            position: relative;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .weekend {
            color: #999;
            background-color: #f5f5f5;
        }
        .lesson-day {
            background-color: #e8f4ff;
            border: 2px solid #4a90e2;
            color: #2c6cb0;
            font-weight: 600;
        }
        .lesson-day::after {
            content: '🎓';
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 0.7em;
        }
        .highlight-day {
            background-color: #fffacd;
            box-shadow: inset 0 0 0 2px #ffd700;
        }
        .empty {
            background-color: transparent;
        }
    </style>
</head>
<body>
    <div class="calendar-container">
        <!-- Январь 2026 -->
        <div class="month">
            <h2 class="month-title">Январь 2026</h2>
            <div class="calendar-grid">
                <div class="day-name">Пн</div>
                <div class="day-name">Вт</div>
                <div class="day-name">Ср</div>
                <div class="day-name">Чт</div>
                <div class="day-name">Пт</div>
                <div class="day-name weekend">Сб</div>
                <div class="day-name weekend">Вс</div>

                <div class="day empty"></div>
                <div class="day empty"></div>
                <div class="day empty"></div>
                <div class="day">1</div>
                <div class="day">2</div>
                <div class="day weekend">3</div>
                <div class="day weekend">4</div>

                <div class="day">5</div>
                <div class="day">6</div>
                <div class="day">7</div>
                <div class="day">8</div>
                <div class="day">9</div>
                <div class="day weekend">10</div>
                <div class="day weekend">11</div>

                <div class="day">12</div>
                <div class="day lesson-day highlight-day">13</div>
                <div class="day">14</div>
                <div class="day">15</div>
                <div class="day lesson-day highlight-day">16</div>
                <div class="day weekend">17</div>
                <div class="day weekend">18</div>

                <div class="day">19</div>
                <div class="day lesson-day highlight-day">20</div>
                <div class="day">21</div>
                <div class="day">22</div>
                <div class="day lesson-day highlight-day">23</div>
                <div class="day weekend">24</div>
                <div class="day weekend">25</div>

                <div class="day">26</div>
                <div class="day lesson-day highlight-day">27</div>
                <div class="day">28</div>
                <div class="day">29</div>
                <div class="day lesson-day highlight-day">30</div>
                <div class="day weekend">31</div>
            </div>
        </div>

        <!-- Февраль 2026 -->
        <div class="month">
            <h2 class="month-title">Февраль 2026</h2>
            <div class="calendar-grid">
                <div class="day-name">Пн</div>
                <div class="day-name">Вт</div>
                <div class="day-name">Ср</div>
                <div class="day-name">Чт</div>
                <div class="day-name">Пт</div>
                <div class="day-name weekend">Сб</div>
                <div class="day-name weekend">Вс</div>

                <div class="day">2</div>
                <div class="day lesson-day highlight-day">3</div>
                <div class="day">4</div>
                <div class="day">5</div>
                <div class="day lesson-day highlight-day">6</div>
                <div class="day weekend">7</div>
                <div class="day weekend">8</div>

                <div class="day">9</div>
                <div class="day lesson-day">10</div>
                <div class="day highlight-day">11</div>
                <div class="day">12</div>
                <div class="day lesson-day">13</div>
                <div class="day weekend">14</div>
                <div class="day weekend">15</div>

                <div class="day">16</div>
                <div class="day">17</div>
                <div class="day">18</div>
                <div class="day">19</div>
                <div class="day">20</div>
                <div class="day weekend">21</div>
                <div class="day weekend">22</div>

                <div class="day">23</div>
                <div class="day">24</div>
                <div class="day">25</div>
                <div class="day">26</div>
                <div class="day">27</div>
                <div class="day weekend">28</div>
                <div class="day empty"></div>
            </div>
        </div>
    </div>
</body>
</html>
